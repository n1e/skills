{% extends "base.html" %}

{% block title %}系统设置{% endblock %}

{% block content %}
<!-- 页面头部 -->
<div class="page-header">
    <h1 class="page-title">⚙️ 系统设置</h1>
    <p class="page-subtitle">配置系统参数，修改后立即生效</p>
</div>

<!-- 配置文件路径提示 -->
<div class="card" style="padding: 15px 20px; margin-bottom: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div style="display: flex; justify-content: space-between; align-items: center; color: white;">
        <div>
            <span style="font-weight: 600;">配置文件路径:</span>
            <code style="background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 4px; margin-left: 10px; font-size: 0.9em;">
                {{ config_path }}
            </code>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" onclick="reloadConfig()" style="background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3);">
                🔄 重新加载
            </button>
            <button class="btn btn-primary" onclick="saveAllConfig()" style="background: white; color: #667eea; border: none;">
                💾 保存所有设置
            </button>
        </div>
    </div>
</div>

<!-- 配置表单 -->
<form id="configForm">
    <!-- 基础配置 -->
    <div class="card">
        <div class="card-title">
            <span class="icon">📋</span>
            基础配置
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">运行时间 <span style="color: #999; font-weight: normal; font-size: 0.85em;">(默认运行时间)</span></label>
                <input type="time" class="form-input" name="run_time" id="config_run_time">
            </div>
            <div class="form-group">
                <label class="form-label">输出目录</label>
                <input type="text" class="form-input" name="output_dir" id="config_output_dir" placeholder="output">
            </div>
        </div>
    </div>

    <!-- 市场配置 -->
    <div class="card">
        <div class="card-title">
            <span class="icon">📈</span>
            市场配置
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">涨停阈值 <span style="color: #999; font-weight: normal; font-size: 0.85em;">(%)</span></label>
                <input type="number" step="0.1" class="form-input" name="market.min_change_pct" id="config_market_min_change_pct" placeholder="9.5">
            </div>
            <div class="form-group">
                <label class="form-label">成交量历史天数</label>
                <input type="number" class="form-input" name="volume_history.days" id="config_volume_history_days" placeholder="30">
            </div>
        </div>
    </div>

    <!-- 人气排名配置 -->
    <div class="card">
        <div class="card-title">
            <span class="icon">🔥</span>
            人气排名配置
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">排名数量</label>
                <input type="number" class="form-input" name="heat_rank.top" id="config_heat_rank_top" placeholder="50">
            </div>
            <div class="form-group">
                <label class="form-label">数据来源 <span style="color: #999; font-weight: normal; font-size: 0.85em;">(逗号分隔)</span></label>
                <input type="text" class="form-input" name="heat_rank.sources" id="config_heat_rank_sources" placeholder="wencai, xueqiu, eastmoney, thsi">
            </div>
        </div>
    </div>

    <!-- 新闻热度配置 -->
    <div class="card">
        <div class="card-title">
            <span class="icon">📰</span>
            新闻热度配置
        </div>
        <div class="grid-2">
            <div class="form-group" style="display: flex; align-items: center; gap: 15px;">
                <label class="form-label" style="margin-bottom: 0;">启用新闻热度</label>
                <label class="switch" style="margin-bottom: 0;">
                    <input type="checkbox" id="config_news_rank_enabled" name="news_rank.enabled">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="form-group">
                <label class="form-label">新闻排名数量</label>
                <input type="number" class="form-input" name="news_rank.top" id="config_news_rank_top" placeholder="30">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">新闻来源 <span style="color: #999; font-weight: normal; font-size: 0.85em;">(逗号分隔)</span></label>
            <textarea class="form-input form-textarea" name="news_rank.sources" id="config_news_rank_sources" 
                      placeholder="weibo, zhihu, bilibili, bilibili_video, baidu, douyin, ithome, juejin, hupu, tieba, douban, sspai, nowcoder, wallstreetcn, ifeng, thepaper, 36kr, solidot"
                      style="min-height: 80px;"></textarea>
        </div>
    </div>

    <!-- 涨停股票配置 -->
    <div class="card">
        <div class="card-title">
            <span class="icon">🚀</span>
            涨停股票配置
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">涨停阈值 <span style="color: #999; font-weight: normal; font-size: 0.85em;">(%)</span></label>
                <input type="number" step="0.1" class="form-input" name="surge.min_change_pct" id="config_surge_min_change_pct" placeholder="9.5">
            </div>
            <div class="form-group">
                <label class="form-label">最大获取数量</label>
                <input type="number" class="form-input" name="surge.max_stocks" id="config_surge_max_stocks" placeholder="200">
            </div>
        </div>
    </div>

    <!-- 问财API配置 -->
    <div class="card">
        <div class="card-title">
            <span class="icon">🔑</span>
            问财 API 配置
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">API Key</label>
                <input type="password" class="form-input" name="wencai.api_key" id="config_wencai_api_key" placeholder="sk-proj-...">
            </div>
            <div class="form-group">
                <label class="form-label">技能名称</label>
                <input type="text" class="form-input" name="wencai.skill_name" id="config_wencai_skill_name" placeholder="基本资料查询">
            </div>
        </div>
        <div class="grid-2">
            <div class="form-group" style="display: flex; align-items: center; gap: 15px;">
                <label class="form-label" style="margin-bottom: 0;">优先使用 OpenAPI</label>
                <label class="switch" style="margin-bottom: 0;">
                    <input type="checkbox" id="config_wencai_prefer_openapi" name="wencai.prefer_openapi">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="form-group" style="display: flex; align-items: center; gap: 15px;">
                <label class="form-label" style="margin-bottom: 0;">优先使用 CLI</label>
                <label class="switch" style="margin-bottom: 0;">
                    <input type="checkbox" id="config_wencai_prefer_cli" name="wencai.prefer_cli">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- 服务配置 -->
    <div class="card">
        <div class="card-title">
            <span class="icon">🖥️</span>
            服务配置
            <span class="tag" style="margin-left: 10px; font-size: 0.7em; background: #e7f5ff; color: #1971c2;">热生效</span>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">定时任务时间 <span style="color: #999; font-weight: normal; font-size: 0.85em;">(每日执行时间)</span></label>
                <input type="time" class="form-input" name="service.schedule_time" id="config_service_schedule_time">
            </div>
            <div class="form-group">
                <label class="form-label">Web 端口</label>
                <input type="number" class="form-input" name="service.web_port" id="config_service_web_port" placeholder="5000">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Web 监听地址</label>
            <input type="text" class="form-input" name="service.web_host" id="config_service_web_host" placeholder="0.0.0.0">
        </div>
    </div>

    <!-- 推送配置 -->
    <div class="card">
        <div class="card-title">
            <span class="icon">📤</span>
            推送配置
            <span class="tag" style="margin-left: 10px; font-size: 0.7em; background: #e7f5ff; color: #1971c2;">热生效</span>
        </div>
        
        <div class="form-group" style="display: flex; align-items: center; gap: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
            <label class="form-label" style="margin-bottom: 0; font-size: 1.1em;">启用推送功能</label>
            <label class="switch" style="margin-bottom: 0;">
                <input type="checkbox" id="config_push_enabled" name="push.enabled">
                <span class="slider"></span>
            </label>
        </div>

        <!-- 飞书推送 -->
        <div style="border-top: 2px solid #e9ecef; padding-top: 20px; margin-top: 20px;">
            <h4 style="margin-bottom: 15px; color: #555; display: flex; align-items: center; gap: 8px;">
                <span>💬</span> 飞书推送
            </h4>
            <div class="form-group" style="display: flex; align-items: center; gap: 15px;">
                <label class="form-label" style="margin-bottom: 0;">启用飞书</label>
                <label class="switch" style="margin-bottom: 0;">
                    <input type="checkbox" id="config_push_feishu_enabled" name="push.feishu.enabled">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">App ID</label>
                    <input type="text" class="form-input" name="push.feishu.app_id" id="config_push_feishu_app_id" placeholder="cli_...">
                </div>
                <div class="form-group">
                    <label class="form-label">App Secret</label>
                    <input type="password" class="form-input" name="push.feishu.app_secret" id="config_push_feishu_app_secret">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Chat ID</label>
                <input type="text" class="form-input" name="push.feishu.chat_id" id="config_push_feishu_chat_id" placeholder="oc_...">
            </div>
        </div>

        <!-- 邮件推送 -->
        <div style="border-top: 2px solid #e9ecef; padding-top: 20px; margin-top: 20px;">
            <h4 style="margin-bottom: 15px; color: #555; display: flex; align-items: center; gap: 8px;">
                <span>📧</span> 邮件推送
            </h4>
            <div class="form-group" style="display: flex; align-items: center; gap: 15px;">
                <label class="form-label" style="margin-bottom: 0;">启用邮件</label>
                <label class="switch" style="margin-bottom: 0;">
                    <input type="checkbox" id="config_push_email_enabled" name="push.email.enabled">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">SMTP 服务器</label>
                    <input type="text" class="form-input" name="push.email.smtp_host" id="config_push_email_smtp_host" placeholder="smtp.qq.com">
                </div>
                <div class="form-group">
                    <label class="form-label">SMTP 端口</label>
                    <input type="number" class="form-input" name="push.email.smtp_port" id="config_push_email_smtp_port" placeholder="587">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">SMTP 用户名</label>
                    <input type="text" class="form-input" name="push.email.smtp_user" id="config_push_email_smtp_user" placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">SMTP 密码</label>
                    <input type="password" class="form-input" name="push.email.smtp_password" id="config_push_email_smtp_password">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">发件人邮箱</label>
                    <input type="email" class="form-input" name="push.email.from_email" id="config_push_email_from_email" placeholder="from@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">收件人邮箱 <span style="color: #999; font-weight: normal; font-size: 0.85em;">(逗号分隔)</span></label>
                    <input type="text" class="form-input" name="push.email.to_emails" id="config_push_email_to_emails" placeholder="to1@example.com, to2@example.com">
                </div>
            </div>
        </div>
    </div>

    <!-- 底部保存按钮 -->
    <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px;">
        <button type="button" class="btn btn-secondary" onclick="resetForm()">
            🔄 重置
        </button>
        <button type="submit" class="btn btn-primary" style="min-width: 150px;">
            💾 保存所有设置
        </button>
    </div>
</form>

<!-- 开关样式 -->
<style>
.switch {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 26px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: 0.3s;
    border-radius: 26px;
}

.slider:before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.3s;
    border-radius: 50%;
}

input:checked + .slider {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

input:checked + .slider:before {
    transform: translateX(24px);
}

/* 配置分组标题样式 */
h4 {
    margin-top: 0;
    padding-bottom: 10px;
    border-bottom: 1px solid #e9ecef;
}
</style>
{% endblock %}

{% block scripts %}
<script>
// 当前配置数据
let currentConfig = {};

// 页面加载时获取配置
document.addEventListener('DOMContentLoaded', async function() {
    await loadConfig();
});

// 加载配置
async function loadConfig() {
    try {
        const response = await fetch('/api/config');
        const result = await response.json();
        
        if (result.success) {
            currentConfig = result.config;
            populateForm(currentConfig);
        } else {
            showToast('加载配置失败: ' + result.message, 'error');
        }
    } catch (error) {
        showToast('加载配置失败: ' + error.message, 'error');
    }
}

// 填充表单
function populateForm(config) {
    // 递归设置表单值
    function setValue(key, value) {
        const element = document.getElementById('config_' + key.replace(/\./g, '_'));
        if (!element) return;
        
        if (element.type === 'checkbox') {
            element.checked = value === true;
        } else if (element.type === 'time') {
            // 时间格式处理
            element.value = value || '00:00';
        } else if (Array.isArray(value)) {
            // 数组处理为逗号分隔
            element.value = value.join(', ');
        } else {
            element.value = value !== null && value !== undefined ? value : '';
        }
    }
    
    // 遍历所有配置项
    function iterateConfig(obj, prefix = '') {
        for (const [key, value] of Object.entries(obj)) {
            const fullKey = prefix ? prefix + '.' + key : key;
            
            if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                iterateConfig(value, fullKey);
            } else {
                setValue(fullKey, value);
            }
        }
    }
    
    iterateConfig(config);
}

// 获取表单数据
function getFormData() {
    const result = {};
    
    // 获取所有输入元素
    const inputs = document.querySelectorAll('#configForm input, #configForm textarea, #configForm select');
    
    inputs.forEach(input => {
        if (!input.name) return;
        
        let value;
        if (input.type === 'checkbox') {
            value = input.checked;
        } else if (input.type === 'number') {
            value = input.value ? parseFloat(input.value) : null;
        } else if (input.type === 'time') {
            value = input.value || null;
        } else {
            value = input.value;
            
            // 处理数组类型（逗号分隔）
            if (input.name.includes('sources') || input.name.includes('to_emails')) {
                if (value && value.trim()) {
                    value = value.split(',').map(v => v.trim()).filter(v => v);
                } else {
                    value = [];
                }
            }
        }
        
        // 构建嵌套对象
        const keys = input.name.split('.');
        let current = result;
        
        for (let i = 0; i < keys.length - 1; i++) {
            if (!(keys[i] in current)) {
                current[keys[i]] = {};
            }
            current = current[keys[i]];
        }
        
        current[keys[keys.length - 1]] = value;
    });
    
    return result;
}

// 重置表单
function resetForm() {
    if (confirm('确定要重置所有设置吗？将恢复为当前保存的配置。')) {
        populateForm(currentConfig);
        showToast('已重置为当前配置', 'warning');
    }
}

// 保存所有配置
async function saveAllConfig() {
    const newConfig = getFormData();
    
    try {
        const response = await fetch('/api/config', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ config: newConfig })
        });
        
        const result = await response.json();
        
        if (result.success) {
            showToast(result.message, 'success');
            // 重新加载配置以更新currentConfig
            await loadConfig();
        } else {
            showToast('保存失败: ' + result.message, 'error');
        }
    } catch (error) {
        showToast('保存失败: ' + error.message, 'error');
    }
}

// 重新加载配置
async function reloadConfig() {
    try {
        const response = await fetch('/api/config/reload', {
            method: 'POST'
        });
        
        const result = await response.json();
        
        if (result.success) {
            showToast(result.message, 'success');
            await loadConfig();
        } else {
            showToast('重新加载失败: ' + result.message, 'error');
        }
    } catch (error) {
        showToast('重新加载失败: ' + error.message, 'error');
    }
}

// 表单提交
document.getElementById('configForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    await saveAllConfig();
});
</script>
{% endblock %}
